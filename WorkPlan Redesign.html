/* ── Dashboard ────────────────────────────────────────────────── */
function DashboardScreen({ setScreen, userName }) {
  const pending = MOCK_REQS.filter(r=>r.status==="PENDING").length;
  const approved = MOCK_REQS.filter(r=>r.status==="APPROVED").length;
  const days = MOCK_REQS.filter(r=>r.status==="APPROVED").reduce((s,r)=>s+r.entries.reduce((ss,e)=>ss+e.days,0),0);
  const stats = [
    {value:MOCK_REQS.length, label:"I alt",          color:"var(--c-primary)", bg:"var(--c-primary-light)", icon:"list"},
    {value:pending,          label:"Afventer",        color:"#d97706",          bg:"rgba(217,119,6,.12)",    icon:"alert"},
    {value:approved,         label:"Godkendt",        color:"#059669",          bg:"rgba(5,150,105,.12)",    icon:"check"},
    {value:days,             label:"Godkendte dage",  color:"#7c3aed",          bg:"rgba(124,58,237,.12)",   icon:"calendar"},
  ];
  const DOT = {APPROVED:"#10b981",PENDING:"#f59e0b",REJECTED:"#ef4444",CANCELLED:"#94a3b8"};
  return (
    <div style={{ padding:"32px 36px", maxWidth:860, margin:"0 auto" }}>
      <PageHeader title="Mine ansøgninger" sub={`${userName} · Salgsafdelingen`}
        actions={<Btn icon="plus" onClick={()=>setScreen("new")}>Ny ansøgning</Btn>} />
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, marginBottom:32 }}>
        {stats.map((s,i) => (
          <Card key={i} style={{ padding:"18px 20px" }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between" }}>
              <div><p style={{ fontSize:32, fontWeight:800, color:s.color, letterSpacing:"-0.03em", lineHeight:1 }}>{s.value}</p>
                <p style={{ fontSize:12, color:"var(--c-text-muted)", marginTop:6, fontWeight:600 }}>{s.label}</p></div>
              <div style={{ width:38, height:38, borderRadius:10, background:s.bg, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Icon name={s.icon} size={18} color={s.color} /></div>
            </div>
          </Card>
        ))}
      </div>
      <div style={{ marginBottom:14, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <h2 style={{ fontSize:15, fontWeight:700, color:"var(--c-text)" }}>Alle ansøgninger</h2>
        <span style={{ fontSize:12, color:"var(--c-text-subtle)" }}>{MOCK_REQS.length} i alt</span>
      </div>
      <Card>
        {MOCK_REQS.map((req,i) => {
          const s=[...req.entries].sort((a,b)=>new Date(a.date)-new Date(b.date));
          const f=s[0]?.date,l=s[s.length-1]?.date,d=req.entries.reduce((x,e)=>x+e.days,0);
          return (
            <div key={req.id} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 20px", borderBottom:i<MOCK_REQS.length-1?"1px solid var(--c-border)":"none" }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background:DOT[req.status]??"#9ca3af", flexShrink:0 }} />
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                  <span style={{ fontSize:13.5, fontWeight:600, color:"var(--c-text)" }}>{f===l?fmtDK(f):`${fmtShort(f)} – ${fmtDK(l)}`}</span>
                  {req.note&&<span style={{ fontSize:12, color:"var(--c-text-muted)", fontStyle:"italic" }}>"{req.note}"</span>}
                </div>
                <div style={{ fontSize:12, color:"var(--c-text-subtle)", marginTop:2 }}>{d} dag{d!==1?"e":""} · Oprettet {fmtDK(req.createdAt)}</div>
              </div>
              <StatusBadge status={req.status} />
              {req.status==="PENDING"&&<button style={{ fontSize:12, color:"#ef4444", background:"none", border:"none", cursor:"pointer", fontFamily:"var(--font)", fontWeight:600, padding:"4px 8px", borderRadius:"var(--r-sm)" }}>Annuller</button>}
              <button style={{ fontSize:12, color:"var(--c-primary)", background:"var(--c-primary-light)", border:"none", cursor:"pointer", padding:"5px 11px", borderRadius:"var(--r-sm)", fontWeight:600, fontFamily:"var(--font)" }}>Detaljer</button>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

  const add = () => setEntries(p=>[...p,{date:new Date().toISOString().slice(0,10),type:"FULL_DAY",absenceType:"VACATION"}]);
  const remove = i => setEntries(p=>p.filter((_,x)=>x!==i));
  const update = (i,f,v) => setEntries(p=>p.map((e,x)=>x===i?{...e,[f]:v}:e));
  if (done) return (
    <div style={{ padding:"32px 36px", display:"flex", alignItems:"center", justifyContent:"center", minHeight:"75vh" }}>
      <div style={{ textAlign:"center", maxWidth:340 }}>
        <div style={{ width:64, height:64, borderRadius:"50%", background:"var(--c-success-bg)", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 20px" }}>
          <Icon name="check" size={28} color="var(--c-success)" sw={2.5} />
        </div>
        <h2 style={{ fontSize:22, fontWeight:800, letterSpacing:"-0.02em", marginBottom:8, color:"var(--c-text)" }}>Ansøgning indsendt!</h2>
        <p style={{ fontSize:14, color:"var(--c-text-muted)", marginBottom:24 }}>Din ansøgning er sendt til din leder til godkendelse.</p>
        <Btn onClick={()=>setScreen("dashboard")}>Tilbage til oversigt</Btn>
      </div>
    </div>
  );
  return (
    <div style={{ padding:"32px 36px", maxWidth:860, margin:"0 auto" }}>
      <PageHeader title="Ny ansøgning" sub="Tilføj de dage du ønsker fri" actions={<Btn variant="secondary" onClick={()=>setScreen("dashboard")}>Annuller</Btn>} />
      <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
        <Card style={{ padding:"20px 24px" }}>
          <SectionLabel label="Datointerval" />
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 }}>
            {["Fra","Til"].map((lbl,i)=>(
              <div key={i}>
                <label style={{ display:"block", fontSize:12, fontWeight:600, color:"var(--c-text-muted)", marginBottom:6 }}>{lbl}</label>
                <input type="date" style={{ width:"100%", fontFamily:"var(--font)", fontSize:13.5, padding:"9px 12px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-md)", outline:"none", color:"var(--c-text)", background:"var(--c-surface)" }} />
              </div>
            ))}
          </div>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ fontSize:12, color:"var(--c-text-subtle)" }}>Weekender springes automatisk over</span>
            <Btn size="sm">Tilføj hverdage</Btn>
          </div>
        </Card>
        <Card style={{ padding:"20px 24px" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
            <SectionLabel label={`Datolinjer (${entries.length})`} />
            {entries.length>0&&<button onClick={()=>setEntries([])} style={{ fontSize:12, color:"var(--c-text-subtle)", background:"none", border:"none", cursor:"pointer", fontFamily:"var(--font)", marginBottom:12 }}>Ryd alle</button>}
          </div>
          {entries.length===0
            ? <div style={{ textAlign:"center", padding:"24px", border:"2px dashed var(--c-border)", borderRadius:"var(--r-md)", color:"var(--c-text-subtle)", fontSize:13 }}>Ingen datoer valgt endnu</div>
            : <div style={{ display:"flex", flexDirection:"column", gap:6, maxHeight:260, overflowY:"auto" }}>
              {entries.map((entry,i)=>{
                const abs=ABS_TYPES.find(t=>t.value===entry.absenceType);
                return (
                  <div key={i} style={{ display:"flex", gap:8, alignItems:"center", padding:"8px 12px", background:"var(--c-bg)", borderRadius:"var(--r-sm)", border:"1px solid var(--c-border)" }}>
                    <div style={{ width:8, height:8, borderRadius:"50%", background:abs?.color??"#6b7280", flexShrink:0 }} />
                    <input type="date" value={entry.date} onChange={e=>update(i,"date",e.target.value)}
                      style={{ fontFamily:"var(--font)", fontSize:13, padding:"5px 8px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-sm)", outline:"none", background:"var(--c-surface)", color:"var(--c-text)", flexShrink:0 }} />
                    <select value={entry.absenceType} onChange={e=>update(i,"absenceType",e.target.value)}
                      style={{ fontFamily:"var(--font)", fontSize:13, padding:"5px 8px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-sm)", flex:1, outline:"none", background:"var(--c-surface)", color:"var(--c-text)" }}>
                      {ABS_TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
                    </select>
                    <select value={entry.type} onChange={e=>update(i,"type",e.target.value)}
                      style={{ fontFamily:"var(--font)", fontSize:13, padding:"5px 8px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-sm)", flexShrink:0, outline:"none", background:"var(--c-surface)", color:"var(--c-text)" }}>
                      <option value="FULL_DAY">Hel dag</option>
                      <option value="HALF_DAY_AM">½ dag (fm)</option>
                      <option value="HALF_DAY_PM">½ dag (em)</option>
                    </select>
                    <button onClick={()=>remove(i)} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--c-text-subtle)", padding:4, display:"flex", borderRadius:4 }}
                      onMouseEnter={e=>e.currentTarget.style.color="#ef4444"} onMouseLeave={e=>e.currentTarget.style.color="var(--c-text-subtle)"}>
                      <Icon name="x" size={15} />
                    </button>
                  </div>
                );
              })}
            </div>
          }
          <button onClick={add} style={{ marginTop:12, display:"flex", alignItems:"center", gap:6, fontSize:13, color:"var(--c-primary)", background:"none", border:"none", cursor:"pointer", fontFamily:"var(--font)", fontWeight:700, padding:"4px 0" }}>
            <Icon name="plus" size={14} sw={2.2} /> Tilføj enkelt dato
          </button>
        </Card>
        <Card style={{ padding:"20px 24px" }}>
          <SectionLabel label="Note (valgfri)" />
          <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="F.eks. sommerferie, bryllup, konference…" rows={3} maxLength={500}
            style={{ width:"100%", fontFamily:"var(--font)", fontSize:13.5, padding:"10px 14px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-md)", resize:"none", outline:"none", color:"var(--c-text)", background:"var(--c-surface)" }} />
          <div style={{ fontSize:12, color:"var(--c-text-subtle)", textAlign:"right", marginTop:4 }}>{note.length}/500</div>
        </Card>
        <div style={{ display:"flex", justifyContent:"flex-end", gap:10 }}>
          <Btn variant="secondary" onClick={()=>setScreen("dashboard")}>Annuller</Btn>
          <Btn icon="check" disabled={entries.length===0} onClick={()=>setDone(true)}>Indsend ansøgning</Btn>
        </div>
      </div>
    </div>
  );
}

/* ── Today widget ─────────────────────────────────────────────── */
function TodayWidget({ absentToday }) {
  const today = new Date();
  const total = USERS_DATA.filter(u => u.active && u.role !== "ADMIN").length;
  const absent = absentToday.length;
  const present = Math.max(0, total - absent);
  const label = today.toLocaleDateString("da-DK", { weekday:"long", day:"numeric", month:"long" });
  return (
    <Card style={{ padding:"14px 18px", marginBottom:18 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: absent>0 ? 10 : 0, flexWrap:"wrap", gap:10 }}>
        <p style={{ fontSize:13, fontWeight:700, color:"var(--c-text)" }}>I dag — <span style={{ color:"var(--c-text-muted)", fontWeight:500, textTransform:"capitalize" }}>{label}</span></p>
        <div style={{ display:"flex", gap:14, fontSize:12.5 }}>
          <span style={{ display:"inline-flex", alignItems:"center", gap:6, color:"#059669", fontWeight:600 }}><span style={{ width:7, height:7, borderRadius:"50%", background:"#10b981" }} />{present} til stede</span>
          <span style={{ display:"inline-flex", alignItems:"center", gap:6, color:"#d97706", fontWeight:600 }}><span style={{ width:7, height:7, borderRadius:"50%", background:"#f59e0b" }} />{absent} fraværende</span>
        </div>
      </div>
      {absent === 0
        ? null
        : <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
            {absentToday.map((a,i) => (
              <span key={i} style={{ display:"inline-flex", alignItems:"center", gap:6, padding:"3px 9px", borderRadius:"var(--r-full)", background:"rgba(245,158,11,.1)", border:"1px solid rgba(245,158,11,.25)", fontSize:11.5 }}>
                <span style={{ fontWeight:600, color:"var(--c-text)" }}>{a.name}</span>
                <span style={{ color:"var(--c-text-subtle)" }}>·</span>
                <span style={{ color:"#d97706", fontWeight:600 }}>{a.type}</span>
              </span>
            ))}
          </div>}
    </Card>
  );
}

/* ── Request Detail Panel ─────────────────────────────────────── */
function RequestDetailPanel({ req, open, onClose, onApprove, onReject, onCancel, onEditNote }) {
  const [showReject, setShowReject] = useState(false);
  const [rejectReason, setRejectReason] = useState("");
  const [showEditNote, setShowEditNote] = useState(false);
  const [noteDraft, setNoteDraft] = useState("");
  const [showCapacity, setShowCapacity] = useState(false);
  useEffect(() => {
    setShowReject(false); setRejectReason("");
    setShowEditNote(false); setNoteDraft(req?.note ?? "");
    setShowCapacity(false);
  }, [req?.id, open]);

  if (!req) return <SlideOver open={open} onClose={onClose} title="Ansøgningsdetaljer" />;
  const s = [...req.entries].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const total = req.entries.reduce((x,e)=>x+e.days,0);
  const log = AUDIT_BY_REQ[req.id] ?? [
    { action:"created", by:req.user.name, time:fmtDK(req.createdAt), detail:`Ansøgning oprettet (${total} dag${total!==1?"e":""})` },
  ];
  const logIcon = a => a==="approved"?"check":a==="rejected"?"x":a==="reminder"?"alert":a==="cancelled"?"x":"plus";
  const logColor = a => a==="approved"?"#10b981":a==="rejected"?"#ef4444":a==="reminder"?"#f59e0b":a==="cancelled"?"#94a3b8":"var(--c-primary)";

  const tryApprove = () => {
    // Mock capacity check: if 3+ days in summer → show warning
    const month = s[0] ? new Date(s[0].date).getMonth()+1 : 0;
    if (total >= 3 && (month === 7 || month === 6)) setShowCapacity(true);
    else onApprove(req.id);
  };

  return (
    <SlideOver open={open} onClose={onClose} title="Ansøgningsdetaljer" subtitle={req.user.name} width={520}>

          <div style={{ flex:1 }}>
            <p style={{ fontSize:16, fontWeight:700, color:"var(--c-text)" }}>{req.user.name}</p>
            <p style={{ fontSize:12, color:"var(--c-text-muted)" }}>{req.department.name}</p>
          </div>

            <p style={{ fontSize:11, color:"var(--c-text-subtle)", textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:700, marginBottom:3 }}>Periode</p>
            <p style={{ fontSize:13, fontWeight:600, color:"var(--c-text)" }}>{s[0]?.date===s[s.length-1]?.date?fmtDK(s[0]?.date):`${fmtShort(s[0]?.date)} – ${fmtDK(s[s.length-1]?.date)}`}</p>
          </div>
          <div>
            <p style={{ fontSize:11, color:"var(--c-text-subtle)", textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:700, marginBottom:3 }}>Dage</p>
            <p style={{ fontSize:13, fontWeight:600, color:"var(--c-text)" }}>{total} dag{total!==1?"e":""}</p>
          </div>
          <div>
            <p style={{ fontSize:11, color:"var(--c-text-subtle)", textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:700, marginBottom:3 }}>Oprettet</p>
            <p style={{ fontSize:13, color:"var(--c-text-muted)" }}>{fmtDK(req.createdAt)}</p>
          </div>
          <div>
            <p style={{ fontSize:11, color:"var(--c-text-subtle)", textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:700, marginBottom:3 }}>Type</p>
            <p style={{ fontSize:13, color:"var(--c-text)", fontWeight:600 }}>Ferie</p>
          </div>
          <div style={{ gridColumn:"1 / -1", display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:8 }}>
            <div style={{ flex:1 }}>
              <p style={{ fontSize:11, color:"var(--c-text-subtle)", textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:700, marginBottom:3 }}>Note</p>
              <p style={{ fontSize:13, color:"var(--c-text)", fontStyle: req.note?"italic":"normal" }}>{req.note ? `"${req.note}"` : <span style={{ color:"var(--c-text-subtle)", fontStyle:"normal" }}>Ingen note</span>}</p>

      {showCapacity && (
        <div onClick={()=>setShowCapacity(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:60, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>

              </div>
            </div>
            <p style={{ fontSize:12.5, color:"var(--c-text-subtle)", padding:"10px 14px", background:"var(--c-bg)", borderRadius:"var(--r-md)", marginBottom:14 }}>Du kan godkende alligevel — dette er en blød grænse.</p>
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <Btn variant="secondary" onClick={()=>setShowCapacity(false)}>Genovervej</Btn>
              <Btn variant="success" icon="check" onClick={()=>{onApprove(req.id); setShowCapacity(false);}}>Godkend alligevel</Btn>
            </div>
          </div>
        </div>
      )}

      {/* Edit note dialog */}
      {showEditNote && (
        <div onClick={()=>setShowEditNote(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.5)", zIndex:60, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"var(--c-surface)", borderRadius:"var(--r-lg)", padding:24, maxWidth:420, width:"100%", boxShadow:"var(--sh-lg)" }}>
            <h3 style={{ fontSize:16, fontWeight:800, color:"var(--c-text)", marginBottom:14 }}>Rediger note</h3>
            <textarea value={noteDraft} onChange={e=>setNoteDraft(e.target.value)} rows={3} maxLength={500} placeholder="Tilføj en note…"
              style={{ width:"100%", fontFamily:"var(--font)", fontSize:13.5, padding:"10px 14px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-md)", resize:"none", outline:"none", color:"var(--c-text)", background:"var(--c-surface)" }} />
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:14 }}>
              <Btn variant="secondary" onClick={()=>setShowEditNote(false)}>Annuller</Btn>
              <Btn icon="check" onClick={()=>{onEditNote(req.id, noteDraft); setShowEditNote(false);}}>Gem note</Btn>
            </div>
          </div>
        </div>
      )}
    </SlideOver>
  );
}

/* ── Manager Requests ─────────────────────────────────────────── */
const MONTHS_DA = ["Januar","Februar","Marts","April","Maj","Juni","Juli","August","September","Oktober","November","December"];
function ManagerRequestsScreen({ setScreen }) {
  const [status, setStatus] = useState("PENDING");
  const [month, setMonth] = useState("all");
  const [dept, setDept] = useState("all");
  const [sts, setSts] = useState({});
  const [notes, setNotes] = useState({});
  const [detailId, setDetailId] = useState(null);

  const resolve = (id,s) => { setSts(x=>({...x,[id]:s})); setDetailId(null); };
  const editNoteFor = (id, n) => setNotes(x=>({...x,[id]:n}));
  const cancelReq = id => { setSts(x=>({...x,[id]:"CANCELLED"})); setDetailId(null); };

  const enriched = MGR_MOCK.map(r => ({ ...r, status: sts[r.id] ?? r.status, note: notes[r.id] ?? r.note }));
  const pending = enriched.filter(r=>r.status==="PENDING").length;

  const shown = enriched.filter(r => {
    if (status!=="all" && r.status!==status) return false;
    if (dept!=="all" && r.department.name!==dept) return false;
    if (month!=="all") {
      const m = parseInt(month);
      if (!r.entries.some(e => new Date(e.date).getMonth()+1 === m)) return false;
    }
    return true;
  });

  const absentToday = [
    { name:"Sofie Madsen",    type:"Ferie" },
    { name:"Lone Frederiksen",type:"Sygdom" },
  ];

  const detailReq = enriched.find(r => r.id === detailId);

  const TABS = [{v:"PENDING",label:"Afventer"},{v:"APPROVED",label:"Godkendt"},{v:"REJECTED",label:"Afvist"},{v:"all",label:"Alle"}];

/* ── On Behalf (Manager creates request for someone) ──────────── */
function OnBehalfScreen({ setScreen }) {
  const [target, setTarget] = useState(USERS_DATA[1]?.id ?? "");
  const [rangeFrom, setRangeFrom] = useState("");
  const [rangeTo, setRangeTo] = useState("");
  const [rangeType, setRangeType] = useState("VACATION");
  const [entries, setEntries] = useState([
    { date:"2026-08-03", type:"FULL_DAY", absenceType:"SICK" },
  ]);
  const [note, setNote] = useState("Sygemelding registreret bagud");
  const [done, setDone] = useState(false);

  const targetUser = USERS_DATA.find(u=>u.id===target);
  const add = () => setEntries(p=>[...p,{date:new Date().toISOString().slice(0,10),type:"FULL_DAY",absenceType:"VACATION"}]);
  const remove = i => setEntries(p=>p.filter((_,x)=>x!==i));
  const update = (i,f,v) => setEntries(p=>p.map((e,x)=>x===i?{...e,[f]:v}:e));
  const fillRange = () => {
    if (!rangeFrom || !rangeTo) return;
    const days = [];
    const start = new Date(rangeFrom), end = new Date(rangeTo);
    for (let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) {
      const dow = d.getDay();
      if (dow===0||dow===6) continue;
      days.push({ date: d.toISOString().slice(0,10), type:"FULL_DAY", absenceType: rangeType });
    }
    if (days.length) setEntries(days);
  };

  if (done) return (
    <div style={{ padding:"32px 36px", display:"flex", alignItems:"center", justifyContent:"center", minHeight:"75vh" }}>
      <div style={{ textAlign:"center", maxWidth:380 }}>
        <div style={{ width:64, height:64, borderRadius:"50%", background:"var(--c-success-bg)", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 20px" }}>
          <Icon name="check" size={28} color="var(--c-success)" sw={2.5} />
        </div>
        <h2 style={{ fontSize:22, fontWeight:800, letterSpacing:"-0.02em", marginBottom:8, color:"var(--c-text)" }}>Oprettet og godkendt</h2>
        <p style={{ fontSize:14, color:"var(--c-text-muted)", marginBottom:24 }}>Ansøgningen er oprettet på vegne af {targetUser?.name} og direkte godkendt. Medarbejderen får en notifikation.</p>
        <Btn onClick={()=>setScreen("manager")}>Tilbage til ansøgninger</Btn>
      </div>
    </div>
  );

  const sel = { width:"100%", fontFamily:"var(--font)", fontSize:13.5, padding:"10px 14px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-md)", outline:"none", background:"var(--c-surface)", color:"var(--c-text)" };

  return (
    <div style={{ padding:"32px 36px", maxWidth:860, margin:"0 auto" }}>
      <PageHeader title="Opret på vegne af medarbejder" sub="Ansøgningen oprettes som direkte godkendt"
        actions={<Btn variant="secondary" onClick={()=>setScreen("manager")}>Annuller</Btn>} />

      <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
        <Card style={{ padding:"20px 24px" }}>
          <SectionLabel label="Medarbejder" />
          <select value={target} onChange={e=>setTarget(e.target.value)} style={sel}>
            {USERS_DATA.filter(u=>u.active).map(u=>(
              <option key={u.id} value={u.id}>{u.name} — {u.dept}</option>
            ))}
          </select>
          <p style={{ fontSize:12, color:"var(--c-text-subtle)", marginTop:8 }}>Brug typisk til at registrere sygdom, barsel eller fravær med tilbagedatering.</p>
        </Card>

        <Card style={{ padding:"20px 24px", background:"var(--c-primary-light)", borderColor:"rgba(79,70,229,.2)" }}>
          <SectionLabel label="Udfyld fra datointerval" />
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
            <input type="date" value={rangeFrom} onChange={e=>setRangeFrom(e.target.value)} style={sel} />
            <input type="date" value={rangeTo}   onChange={e=>setRangeTo(e.target.value)}   style={sel} />
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <select value={rangeType} onChange={e=>setRangeType(e.target.value)} style={{ ...sel, flex:1 }}>
              {ABS_TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
            </select>
            <Btn onClick={fillRange}>Udfyld</Btn>
          </div>
        </Card>

        <Card style={{ padding:"20px 24px" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
            <SectionLabel label={`Datolinjer (${entries.length})`} />
            <button onClick={add} style={{ fontSize:12.5, color:"var(--c-primary)", background:"none", border:"none", cursor:"pointer", fontFamily:"var(--font)", fontWeight:700 }}>+ Tilføj dag</button>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6, maxHeight:260, overflowY:"auto" }}>
            {entries.map((entry,i)=>{
              const abs=ABS_TYPES.find(t=>t.value===entry.absenceType);
              return (
                <div key={i} style={{ display:"flex", gap:8, alignItems:"center", padding:"8px 12px", background:"var(--c-bg)", borderRadius:"var(--r-sm)", border:"1px solid var(--c-border)" }}>
                  <div style={{ width:8, height:8, borderRadius:"50%", background:abs?.color??"#6b7280", flexShrink:0 }} />
                  <input type="date" value={entry.date} onChange={e=>update(i,"date",e.target.value)} style={{ ...sel, padding:"5px 8px", fontSize:13, flexShrink:0, width:150 }} />
                  <select value={entry.absenceType} onChange={e=>update(i,"absenceType",e.target.value)} style={{ ...sel, padding:"5px 8px", fontSize:13, flex:1 }}>
                    {ABS_TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
                  </select>
                  <select value={entry.type} onChange={e=>update(i,"type",e.target.value)} style={{ ...sel, padding:"5px 8px", fontSize:13, flexShrink:0, width:130 }}>
                    <option value="FULL_DAY">Hel dag</option>
                    <option value="HALF_DAY_AM">½ dag (fm)</option>
                    <option value="HALF_DAY_PM">½ dag (em)</option>
                  </select>
                  <button onClick={()=>remove(i)} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--c-text-subtle)", padding:4, display:"flex" }}>
                    <Icon name="x" size={15} />
                  </button>
                </div>
              );
            })}
          </div>
        </Card>

        <Card style={{ padding:"20px 24px" }}>
          <SectionLabel label="Note (valgfri)" />
          <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} maxLength={500}
            style={{ width:"100%", fontFamily:"var(--font)", fontSize:13.5, padding:"10px 14px", border:"1.5px solid var(--c-border)", borderRadius:"var(--r-md)", resize:"none", outline:"none", color:"var(--c-text)", background:"var(--c-surface)" }} />
        </Card>

        <div style={{ display:"flex", justifyContent:"flex-end", gap:10 }}>
          <Btn variant="secondary" onClick={()=>setScreen("manager")}>Annuller</Btn>
          <Btn icon="check" disabled={entries.length===0} onClick={()=>setDone(true)}>Opret og godkend</Btn>
        </div>
      </div>
    </div>
  );
}

/* ── Calendar ─────────────────────────────────────────────────── */
function CalendarScreen() {
  const [month, setMonth] = useState(6);
  const [year, setYear] = useState(2026);
  const MN = ["Januar","Februar","Marts","April","Maj","Juni","Juli","August","September","Oktober","November","December"];
  const DS = ["M","T","O","T","F","L","S"];
  const daysInMonth = new Date(year, month, 0).getDate();
  const days = Array.from({length:daysInMonth},(_,i)=>new Date(year,month-1,i+1));
  const isWe = d => d.getDay()===0||d.getDay()===6;
  const dow = d => { const x=d.getDay(); return x===0?6:x-1; };
  const nav = delta => { let m=month+delta, y=year; if(m<1){m=12;y--;} if(m>12){m=1;y++;} setMonth(m); setYear(y); };
  return (
    <div style={{ padding:"32px 36px" }}>
      <PageHeader title="Kalender"
        actions={<>
          <Btn variant="secondary" size="sm" icon="chevL" onClick={()=>nav(-1)}>Forrige</Btn>
          <span style={{ fontSize:15, fontWeight:700, color:"var(--c-text)", minWidth:160, textAlign:"center" }}>{MN[month-1]} {year}</span>
          <Btn variant="secondary" size="sm" onClick={()=>nav(1)}>Næste <Icon name="chevR" size={14} /></Btn>
        </>} />
      <div style={{ display:"flex", gap:14, marginBottom:16, flexWrap:"wrap" }}>
        {CAL_DATA.map(d=>(
          <div key={d.name} style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--c-text-muted)" }}>
            <div style={{ width:10, height:10, borderRadius:3, background:d.color }} />
            {d.name}
          </div>
        ))}
        <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--c-text-muted)" }}><div style={{ width:10, height:10, borderRadius:3, background:"#fef3c7", border:"1px solid #fbbf24" }} />Afventer</div>
        <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:"var(--c-text-muted)" }}><div style={{ width:10, height:10, borderRadius:3, background:"var(--c-border)" }} />Weekend</div>
      </div>
      <Card style={{ overflow:"auto" }}>
        <table style={{ borderCollapse:"collapse", fontSize:12, minWidth:"max-content", width:"100%" }}>
          <thead>
            <tr>
              <th style={{ position:"sticky", left:0, background:"var(--c-surface)", zIndex:10, padding:"8px 16px", textAlign:"left", fontSize:11.5, fontWeight:700, color:"var(--c-text-muted)", borderBottom:"2px solid var(--c-border)", whiteSpace:"nowrap", minWidth:160 }}>Medarbejder</th>
              {days.map((d,i)=>{
                const we=isWe(d);
                return (
                  <th key={i} style={{ minWidth:30, width:30, padding:"4px 0", textAlign:"center", borderBottom:"2px solid var(--c-border)", background:we?"var(--c-bg)":"var(--c-surface)", color:we?"var(--c-text-subtle)":"var(--c-text-muted)" }}>
                    <div style={{ fontSize:11, fontWeight:600 }}>{d.getDate()}</div>
                    <div style={{ fontSize:9, opacity:.7, textTransform:"uppercase" }}>{DS[dow(d)]}</div>
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {CAL_DATA.map((dept,di)=>(
              <React.Fragment key={di}>
                <tr>
                  <td colSpan={daysInMonth+1} style={{ padding:"5px 16px", background:dept.color, color:"white", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.06em" }}>{dept.name}</td>
                </tr>
                {dept.users.map((user,ui)=>(
                  <tr key={ui} style={{ background:ui%2===0?"var(--c-surface)":"var(--c-bg)" }}>
                    <td style={{ position:"sticky", left:0, background:ui%2===0?"var(--c-surface)":"var(--c-bg)", zIndex:5, padding:"5px 16px", fontWeight:600, color:"var(--c-text)", fontSize:12.5, borderBottom:"1px solid var(--c-border)", whiteSpace:"nowrap", minWidth:160 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:7 }}>
                        <div style={{ width:6, height:6, borderRadius:"50%", background:dept.color, flexShrink:0 }} />
                        {user.name}
                      </div>
                    </td>
                    {days.map((d,di2)=>{
                      const day=d.getDate(), we=isWe(d);
                      const approved=user.approved.includes(day), pending=user.pending.includes(day);
                      let bg="transparent", content=null;
                      if (approved) { bg=dept.color+"28"; content=<span style={{ color:dept.color, fontWeight:800, fontSize:11 }}>✓</span>; }
                      else if (pending) { bg="#fef3c7"; content=<span style={{ color:"#d97706", fontWeight:800, fontSize:11 }}>?</span>; }
                      else if (we) bg="var(--c-bg)";
                      return (
                        <td key={di2} style={{ height:30, borderBottom:"1px solid var(--c-border)", textAlign:"center", background:bg, cursor:approved||pending?"pointer":"default" }}>
                          {content}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

                        onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--c-border)"; e.currentTarget.style.color="var(--c-text-subtle)"; e.currentTarget.style.background="none";}}>
                        + vagt
                      </button>
                    </div>
                  );
                })}
              </div>
            ))}
            {emps.length===0 && <div style={{ padding:40, textAlign:"center", color:"var(--c-text-subtle)", fontSize:13 }}>Ingen medarbejdere i den valgte afdeling</div>}

      )}

      {tab==="templates" && (

          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:14, alignItems:"center" }}>

/* ── SlideOver panel ─────────────────────────────────────────── */
function SlideOver({ open, onClose, title, subtitle, children, width = 500 }) {
  useEffect(() => {
    const h = e => { if (e.key === "Escape") onClose(); };
    if (open) document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, [open, onClose]);
  return (
    <>
      <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:50, backdropFilter:"blur(3px)", opacity:open?1:0, pointerEvents:open?"all":"none", transition:"opacity .25s" }} />
      <div style={{ position:"fixed", top:0, right:0, bottom:0, width, background:"var(--c-surface)", zIndex:51, transform:open?"translateX(0)":"translateX(100%)", transition:"transform .28s cubic-bezier(.4,0,.2,1)", display:"flex", flexDirection:"column", boxShadow:"-8px 0 40px rgba(0,0,0,.18)" }}>
        <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", padding:"22px 24px 18px", borderBottom:"1px solid var(--c-border)", flexShrink:0 }}>
          <div>
            <h2 style={{ fontSize:17, fontWeight:800, color:"var(--c-text)", letterSpacing:"-0.02em" }}>{title}</h2>
            {subtitle && <p style={{ fontSize:12.5, color:"var(--c-text-muted)", marginTop:3 }}>{subtitle}</p>}
          </div>
          <button onClick={onClose} style={{ width:32, height:32, borderRadius:"var(--r-md)", border:"1.5px solid var(--c-border)", background:"var(--c-bg)", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", color:"var(--c-text-muted)", flexShrink:0, marginLeft:12 }}>
            <Icon name="x" size={16} />
          </button>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"24px" }}>{children}</div>
      </div>
    </>
  );
}

/* ══ APP ════════════════════════════════════════════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "sidebarStyle": "gradient",
  "primaryColor": "#2454ff",
  "role": "ADMIN",
  "darkMode": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [loggedIn, setLoggedIn] = useState(false);
  const [userName] = useState("Anders Andersen");
  const [screen, setScreen] = useState("dashboard");

  useEffect(() => {
    document.documentElement.classList.toggle("dark", t.darkMode);
  }, [t.darkMode]);

  useEffect(() => {
    document.documentElement.style.setProperty("--c-primary", t.primaryColor);
    document.documentElement.style.setProperty("--c-primary-hover", shadeColor(t.primaryColor, -15));
  }, [t.primaryColor]);

  function shadeColor(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, ((n>>16)&0xff) + pct));
    const g = Math.max(0, Math.min(255, ((n>>8)&0xff) + pct));
    const b = Math.max(0, Math.min(255, (n&0xff) + pct));
    return "#" + [r,g,b].map(x => x.toString(16).padStart(2,"0")).join("");
  }

  if (!loggedIn) return (
    <>
      <LoginScreen onLogin={() => setLoggedIn(true)} />
      <TweaksPanel>
        <TweakSection label="Primærfarve" />
        <TweakColor label="Farve" value={t.primaryColor} options={["#4f46e5","#2454ff","#0d9488","#dc2626","#d97706","#7c3aed"]} onChange={v => setTweak("primaryColor", v)} />
        <TweakSection label="Udseende" />
        <TweakToggle label="Mørk tilstand" value={t.darkMode} onChange={v => setTweak("darkMode", v)} />
      </TweaksPanel>
    </>
  );

  function renderScreen() {
    switch (screen) {
      case "dashboard":   return <DashboardScreen setScreen={setScreen} userName={userName} />;
      case "new":         return <NewRequestScreen setScreen={setScreen} />;
      case "manager":     return <ManagerRequestsScreen setScreen={setScreen} />;
      case "onbehalf":    return <OnBehalfScreen setScreen={setScreen} />;
      case "shifts":      return <ShiftsScreen />;
      case "calendar":    return <CalendarScreen />;
      case "users":       return <UsersScreen />;
      case "departments": return <DepartmentsScreen />;
      case "holidays":    return <HolidaysScreen />;
      case "reports":     return <ReportsScreen />;
      case "settings":    return <SettingsScreen />;
      case "profile":     return <ProfileScreen userName={userName} />;
      default:            return null;
    }
  }

  return (
    <div style={{ display:"flex", height:"100vh", overflow:"hidden" }}>
      <Sidebar screen={screen} setScreen={setScreen} role={t.role} userName={userName} onLogout={() => setLoggedIn(false)} sidebarStyle={t.sidebarStyle} darkMode={t.darkMode} />
      <main style={{ flex:1, overflowY:"auto", background:"var(--c-bg)", display:"flex", flexDirection:"column" }}>
        <TopBar darkMode={t.darkMode} onToggleDark={() => setTweak("darkMode", !t.darkMode)} />
        <div style={{ flex:1 }}>{renderScreen()}</div>
      </main>
      <TweaksPanel>
        <TweakSection label="Primærfarve" />
        <TweakColor label="Farve" value={t.primaryColor} options={["#4f46e5","#2454ff","#0d9488","#dc2626","#d97706","#7c3aed"]} onChange={v => setTweak("primaryColor", v)} />
        <TweakSection label="Udseende" />
        <TweakToggle label="Mørk tilstand" value={t.darkMode} onChange={v => setTweak("darkMode", v)} />
        <TweakSection label="Sidebar" />
        <TweakRadio label="Stil" value={t.sidebarStyle} options={["dark","light","gradient"]} onChange={v => setTweak("sidebarStyle", v)} />
        <TweakSection label="Demo-rolle" />
        <TweakSelect label="Rolle" value={t.role} options={["EMPLOYEE","MANAGER","ADMIN"]} onChange={v => setTweak("role", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
